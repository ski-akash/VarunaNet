server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path nginx doesn't have a static file for falls
    # back to index.html rather than a 404, so client-side routing (once
    # there is any) doesn't break on a page refresh or a direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
