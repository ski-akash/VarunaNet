# Conda environment for training on the SLURM cluster, for sites using
# Apptainer/Singularity + conda rather than Docker (spec section 8: "many
# clusters use Singularity/Apptainer rather than Docker" -- this is the
# alternative to infra/Dockerfile.train, not a replacement for it).
#
# Pinned to the exact versions this project's training path (models/,
# training/) was built and tested against locally -- "pin the environment
# exactly" is a spec requirement, not just good practice: a training run
# that silently uses a different torch/torchvision minor version than
# what was actually tested is exactly the kind of mismatch that wastes a
# queued GPU job hours later on a shape or API difference nobody caught.
# Keep this in sync with infra/Dockerfile.train's pinned versions -- they
# intentionally duplicate each other rather than sharing one file, since
# a conda `pip: -r ../other/requirements.txt` relative-path include is
# fragile across different `conda env create` invocation directories.
#
# GPU target: A100 (Ampere, confirmed). torch==2.13.0's Linux wheels pull
# in CUDA 13.0.3 runtime libraries automatically via pip (nvidia-cublas-cu13,
# nvidia-cudnn-cu13, etc.) -- confirmed against this exact release's
# published PyPI metadata, not assumed -- so no separate --index-url or
# system CUDA toolkit install is needed here. That CUDA 13 target does
# require an NVIDIA driver new enough to support it. Check with
# `nvidia-smi` on a cluster login/compute node before the first real job
# -- the driver's reported "CUDA Version" is the *maximum* it supports,
# not necessarily what's installed -- since this project has no way to
# verify the actual cluster's driver version from here. If it's older,
# install an older matching torch/torchvision build instead (see
# https://pytorch.org/get-started/locally/ for available options) rather
# than assuming this file's pins work unmodified.
name: varunanet
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.13.0
      - torchvision==0.28.0
      - segmentation_models_pytorch==0.5.0
      - hydra-core==1.3.5
      - omegaconf==2.3.1
      - wandb==0.28.2
      - numpy==2.5.2
      - rasterio==1.5.1
      - pysheds==0.5
      - affine==3.0.0
      - matplotlib==3.11.1
      - scikit-image==0.26.0
      - scikit-learn==1.9.0
