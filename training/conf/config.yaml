# Top-level training config. Composed from the config groups below (model,
# loss) plus the scalar fields here; merged against training/config.py's
# TrainConfig dataclass at load time for type validation.
#
# Override anything from the command line without editing this file, e.g.:
#   python -m training.train seed=1 optimizer.lr=3e-4
#   python -m training.train loss=focal
#   python -m training.train dataset=sen1floods11    # real data instead of synthetic
#   python -m training.train --multirun seed=1,2,3   # the spec's 3-seed runs
defaults:
  - model: unet_resnet34
  - loss: dice_bce
  - dataset: synthetic
  - _self_

seed: 0
device: auto
amp_dtype: fp32
epochs: 1
checkpoint_dir: checkpoints
checkpoint_every_steps: 50
resume_from: null
init_weights_from: null
validate_every_epochs: 1
early_stopping_patience: 5

optimizer:
  lr: 1e-4
  weight_decay: 1e-2
  betas: [0.9, 0.999]

scheduler:
  warmup_steps: 0
  min_lr_ratio: 0.0

wandb:
  project: varunanet
  entity: null
  mode: offline
  log_every_steps: 1
  dir: null
