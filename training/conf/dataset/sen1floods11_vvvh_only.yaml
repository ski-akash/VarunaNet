# Channel ablation (spec section 3.2): identical to dataset=sen1floods11
# but drops VV_VH_ratio, slope, and HAND, keeping only the raw VV_db/VH_db
# SAR channels -- answers "are the derived/terrain channels actually
# earning their keep, or is the 5-channel model no better than the raw
# 2-channel SAR signal alone?" Must be paired with model.in_channels=2,
# e.g.:
#   python -m training.train dataset=sen1floods11_vvvh_only model.in_channels=2
name: sen1floods11
batch_size: 8
shuffle: true
data_root: datasets/sen1floods11
split_csv_name: flood_train_data.csv
val_split_csv_name: flood_valid_data.csv
test_split_csv_name: flood_test_data.csv
normalization_stats_path: data/sen1floods11_normalization_stats.json
channel_indices: [0, 1]
include_jrc_baseline: false
speckle_prob: 0.0
speckle_looks: 4.0
