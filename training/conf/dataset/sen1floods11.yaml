# The real benchmark dataset (spec section 3.1, Track A):
#   python -m training.train dataset=sen1floods11
#
# data_root matches the on-disk layout VarunaNet_Spec.md's Environment
# notes describe: <data_root>/{S1Hand,LabelHand,DEMHand,splits}/. Real
# data is gitignored (~1.0GB) and fetched locally via
# `python -m data.download_sen1floods11` then `python -m data.fetch_dem`
# -- this config assumes that's already been done.
#
# normalization_stats_path is the artifact data/compute_normalization_stats.py
# produces, computed once on the training split and persisted -- never
# recomputed per-run (spec section 3.3).
name: sen1floods11
batch_size: 8
shuffle: true
data_root: datasets/sen1floods11
split_csv_name: flood_train_data.csv
val_split_csv_name: flood_valid_data.csv
test_split_csv_name: flood_test_data.csv
normalization_stats_path: data/sen1floods11_normalization_stats.json
# None keeps all 5 channels -- see training/conf/dataset/sen1floods11_vvvh_only.yaml
# for the ablation that overrides this. Present here explicitly (not only
# as a TrainConfig dataclass default) because entry points that don't
# merge against TrainConfig -- evaluate_test.py, per_event_eval.py --
# would otherwise hit a struct-mode ConfigAttributeError on this key.
channel_indices: null
include_jrc_baseline: false
# Speckle-noise augmentation (spec section 4.2, data/speckle.py). 0.0
# is a no-op -- matches this dataset's behavior before the knob existed.
# Present explicitly for the same struct-mode reason as the two keys
# above.
speckle_prob: 0.0
speckle_looks: 4.0
