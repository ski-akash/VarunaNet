# The real benchmark dataset (spec section 3.1, Track A):
#   python -m training.train dataset=sen1floods11
#
# data_root matches the on-disk layout VarunaNet_Spec.md's Environment
# notes describe: <data_root>/{S1Hand,LabelHand,DEMHand,splits}/. Real
# data is gitignored (~1.0GB) and fetched locally via
# `python -m data.download_sen1floods11` then `python -m data.fetch_dem`
# -- this config assumes that's already been done.
#
# normalization_stats_path is the artifact data/compute_normalization_stats.py
# produces, computed once on the training split and persisted -- never
# recomputed per-run (spec section 3.3).
name: sen1floods11
batch_size: 8
shuffle: true
data_root: datasets/sen1floods11
split_csv_name: flood_train_data.csv
normalization_stats_path: data/sen1floods11_normalization_stats.json
